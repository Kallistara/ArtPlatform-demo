version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: artplatform-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - artplatform-network

  user-profile-service:
    build:
      context: ./UserService
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MongoDB__ConnectionString=mongodb://mongo:27017
    depends_on:
      - mongo
    networks:
      - artplatform-network

volumes:
  mongo-data:

networks:
  artplatform-network:
    driver: bridge